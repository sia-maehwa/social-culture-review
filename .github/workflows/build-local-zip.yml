name: Build standalone local study app

on:
  push:
    branches: [main]
    paths:
      - 'app-source.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tools/build-offline.js'
      - '.github/workflows/build-local-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

# This workflow only builds and commits the offline HTML.
# GitHub Pages branch publishing handles the website deployment separately.
concurrency:
  group: local-html-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: find js tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build standalone local index.html
        run: node tools/build-offline.js

      - name: Commit updated local entrypoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Local entrypoint is already current."
          else
            git commit -m "Build standalone local study app"
            git push origin HEAD:main
          fi
