name: Import Social Culture Review project

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-social-culture-once.yml"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and verify project archive
        env:
          DROPBOX_URL: "https://uc5347f80d6a80257c8f49ef54b3.dl.dropboxusercontent.com/cd/0/get/DLlj1iLsSK753QC-gyuhOr8uCVoLCVENX7e6W40PYCMfCgZ2S3A6Axi0942SPZ9HzsLvcnmvzmnPkyQoXdL-OE5yO1mKiPWWHYCd2r2084HhYWEbLq53M6LdHY8q8hNzme8LeIcl1kGFTAtb4rnXweIZY3volFzze9U-7UF9LcIQMQ/file?c_luid=24c0357d"
          EXPECTED_SHA256: "06e383ecf9788809526ccd9b41b8678e0f3fe5c0d5892a83a546439d9965c7d6"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/social-culture-review.zip"
          extracted="$RUNNER_TEMP/social-culture-review"
          curl --fail --location --silent --show-error "$DROPBOX_URL" --output "$archive"
          echo "$EXPECTED_SHA256  $archive" | sha256sum --check -
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          test -s "$extracted/index.html"
          test -s "$extracted/js/pen-tools.js"
          test -s "$extracted/js/app.js"
          test -s "$extracted/js/exam-app.js"
          test -s "$extracted/css/style.css"
          file_count="$(find "$extracted" -type f | wc -l | tr -d ' ')"
          test "$file_count" = "314"
          printf "Verified %s project files.\n" "$file_count"
          cp -a "$extracted/." .

      - name: Remove one-time importer and commit project
        run: |
          set -euo pipefail
          git rm .github/workflows/import-social-culture-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add stylus writing tools to social culture review"
          git push origin HEAD:main
          echo "PUSHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
