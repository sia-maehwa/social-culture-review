<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학습 연습장 — 과목별 문제 풀이</title>
<meta name="description" content="과목별 단원 학습, 문제 풀이, 오답 노트, 개념 정리와 스타일러스 필기를 제공하는 학습 연습장." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f4fc0'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>社</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="#" data-nav="home" aria-label="홈으로">
      <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--color-primary)"/><text x="50" y="70" font-size="52" text-anchor="middle" fill="#fff" font-weight="700">社</text></svg>
      <span class="logo-text">사회문화 <em>연습장</em></span>
    </a>
    <label class="subject-switcher" id="subjectSwitcherWrap" hidden>
      <span>과목</span>
      <select id="subjectSwitcher" aria-label="학습 과목 선택"></select>
    </label>
    <nav class="gnb" aria-label="주요 메뉴">
      <button class="gnb-btn" data-nav="home" type="button">문제 풀기</button>
      <button class="gnb-btn" data-nav="exam" type="button">실전 모의고사</button>
      <button class="gnb-btn" data-nav="game" type="button">지식의 탑</button>
      <button class="gnb-btn" data-nav="concepts" type="button">개념 정리</button>
      <button class="gnb-btn" data-nav="wrong" type="button">오답 노트 <span class="wrong-count" id="wrongCountBadge" hidden>0</span></button>
    </nav>
  </div>
</header>

<main id="main" class="container">
  <!-- 홈: 단원 선택 -->
  <section id="view-home" class="view" aria-label="홈"></section>
  <!-- 퀴즈 진행 -->
  <section id="view-quiz" class="view" aria-label="문제 풀이" hidden></section>
  <!-- 결과 -->
  <section id="view-result" class="view" aria-label="결과" hidden></section>
  <!-- 실전 모의고사: 시험지 목록 -->
  <section id="view-exam" class="view" aria-label="실전 모의고사" hidden></section>
  <!-- 실전 모의고사: 응시 -->
  <section id="view-examrun" class="view" aria-label="모의고사 응시" hidden></section>
  <!-- 실전 모의고사: 결과 -->
  <section id="view-examresult" class="view" aria-label="모의고사 결과" hidden></section>
  <!-- 학습 게임: 지식의 탑 -->
  <section id="view-game" class="view" aria-label="지식의 탑 게임" hidden></section>
  <!-- 개념 정리 -->
  <section id="view-concepts" class="view" aria-label="개념 정리" hidden></section>
  <!-- 오답 노트 -->
  <section id="view-wrong" class="view" aria-label="오답 노트" hidden></section>
</main>

<footer class="site-footer">
  <p>과목별 단원 학습 · 문제 풀이 · 오답 노트 · 개념 정리 · 스타일러스 필기</p>
</footer>

<script src="js/data.js"></script>
<script src="js/exams.js"></script>
<script src="js/storage.js"></script>
<script src="js/predict.js"></script>
<script src="js/subject-registry.js"></script>
<script src="js/subjects/social-culture.js"></script>
<!-- 새 과목 모듈은 SubjectRegistry.init() 호출 전에 추가합니다. -->
<script>window.SubjectRegistry.init();</script>
<script src="js/game.js"></script>
<script src="js/pen-tools.js"></script>
<script src="js/exam-app.js"></script>
<script src="js/app.js"></script></body>
</html>
